site_name: SIGADEFA
site_description: Universal multimodal language based on genetic frequency structures
site_author: SIGADEFA Project

theme:
  name: material
  language: ru

nav:
  - Главная: index.md

  - I. Введение:
      - Актуальность проекта: introduction/relevance.md
      - Проблема: introduction/problem.md
      - Цель проекта: introduction/goal.md

  - II. Основания:
      - Объект и предмет: foundations/object_and_subject.md
      - Гипотезы: foundations/hypotheses.md
      - Научная новизна: foundations/novelty.md

  - III. Концепция:
      - Основная идея: concept/main_idea.md
      - Мультимодальность: concept/multimodality.md
      - Гипотеза праязыка: concept/pro_language.md

  - IV. Метод:
      - Методология: method/methodology.md
      - Модели: method/models.md
      - Ограничения: method/limitations.md

  - V. Реализация:
      - Вычислительное ядро: implementation/core.md
      - Акустика: implementation/audio.md
      - Визуализация: implementation/visual.md
      - Язык: implementation/language.md

  - VI. Проверка:
      - Верификация: validation/verification.md
      - Эксперименты: validation/experiments.md
      - Критические точки: validation/critical_points.md

  - VII. Будущее:
      - Применения: future/applications.md
      - Этика: future/ethics.md
      - Перспективы: future/perspectives.md
      - Связь с Хрониками: future/chronicles_link.md

markdown_extensions:
  - admonition
  - footnotes
  - tables
  - toc:
      permalink: true
