[package]
name = "mirror-health-mvp"
version = "0.1.0"
authors = ["OpenAI Agent"]
edition = "2021"
description = "Mirror Health MVP desktop app"

[dependencies]
eframe = { version = "0.27", features = ["wgpu"] }
egui = "0.27"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
thiserror = "2"
screenshots = "0.8"
sysinfo = "0.30"
urlencoding = "2.1"
anyhow = "1"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "libloaderapi"] }
